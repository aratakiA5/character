<svg xmlns="http://www.w3.org/2000/svg" width="288" height="1536" viewBox="0 0 288 1536" shape-rendering="crispEdges">
<rect width="288" height="1536" fill="none"/>
<!-- 4 characters x 4 states x 4 frames. Each frame 72x96. Rows: hero, warrior, mage, priest; within each: idle, attack, hit, victory. -->
<defs>
  <g id="baseHero"><rect x="24" y="8" width="24" height="18" fill="#3b2a22"/><rect x="22" y="24" width="28" height="20" fill="#e7c7a6"/><rect x="20" y="44" width="32" height="30" fill="#3568b8"/><rect x="18" y="74" width="14" height="18" fill="#25324a"/><rect x="40" y="74" width="14" height="18" fill="#25324a"/><rect x="50" y="47" width="5" height="34" fill="#dbeafe"/></g>
  <g id="baseWarrior"><rect x="22" y="7" width="28" height="19" fill="#9a3e2e"/><rect x="22" y="24" width="28" height="20" fill="#e7c0a0"/><rect x="18" y="44" width="36" height="30" fill="#a43b46"/><rect x="18" y="74" width="14" height="18" fill="#442b35"/><rect x="40" y="74" width="14" height="18" fill="#442b35"/><rect x="52" y="45" width="6" height="37" fill="#eef2f7"/></g>
  <g id="baseMage"><rect x="18" y="5" width="36" height="16" fill="#5b2b82"/><rect x="27" y="0" width="18" height="8" fill="#5b2b82"/><rect x="23" y="22" width="26" height="19" fill="#e7c6aa"/><rect x="17" y="41" width="38" height="38" fill="#6241a7"/><rect x="19" y="79" width="14" height="13" fill="#2e2455"/><rect x="39" y="79" width="14" height="13" fill="#2e2455"/><rect x="55" y="37" width="4" height="47" fill="#7a4a28"/><rect x="51" y="32" width="12" height="10" fill="#7ed0ff"/></g>
  <g id="basePriest"><rect x="21" y="7" width="30" height="19" fill="#d6c6a5"/><rect x="23" y="24" width="26" height="19" fill="#e9c9ad"/><rect x="17" y="43" width="38" height="39" fill="#f1f0e6"/><rect x="22" y="55" width="28" height="6" fill="#6ca6d9"/><rect x="20" y="82" width="14" height="10" fill="#c5c5c5"/><rect x="38" y="82" width="14" height="10" fill="#c5c5c5"/><rect x="55" y="38" width="4" height="46" fill="#81542e"/><rect x="51" y="32" width="12" height="12" fill="#f3e6a4"/></g>
</defs>
<script type="application/ecmascript"><![CDATA[]]></script>
<!-- Generate rows manually using repeated groups -->
<g transform="translate(0 0)"><use href="#baseHero"/><g transform="translate(72 0)"><use href="#baseHero"/></g><g transform="translate(144 0)"><use href="#baseHero"/></g><g transform="translate(216 0)"><use href="#baseHero"/></g></g>
<g transform="translate(0 96)"><use href="#baseHero" transform="translate(-4 0)"/><g transform="translate(72 0)"><use href="#baseHero" transform="translate(-12 0)"/></g><g transform="translate(144 0)"><use href="#baseHero" transform="translate(-18 0)"/></g><g transform="translate(216 0)"><use href="#baseHero" transform="translate(-8 0)"/></g></g>
<g transform="translate(0 192)"><use href="#baseHero" transform="translate(4 0)"/><g transform="translate(72 0)"><use href="#baseHero" transform="translate(8 0)"/></g><g transform="translate(144 0)"><use href="#baseHero" transform="translate(5 0)"/></g><g transform="translate(216 0)"><use href="#baseHero" transform="translate(10 0)"/></g></g>
