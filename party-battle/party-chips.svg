<g transform="translate(0 864)"><use href="#baseMage" transform="translate(-4 0)"/><g transform="translate(72 0)"><use href="#baseMage" transform="translate(-12 0)"/></g><g transform="translate(144 0)"><use href="#baseMage" transform="translate(-18 0)"/></g><g transform="translate(216 0)"><use href="#baseMage" transform="translate(-8 0)"/></g></g>
