<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Chip Walk Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>キャラクターチップ歩行デモ</h1>
    <p>マップをクリックすると旗が立ち、キャラクターがそこまで歩きます。矢印キー / WASD でも移動できます。</p>
    <div id="stage" class="stage">
      <div id="flag" class="flag" aria-label="destination"><span></span></div>
      <div id="player" class="player" aria-label="player"></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
